[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
repository = "https://github.com/macromackie/ev-grep"
homepage = "https://ev-grep.com"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
fastrand = "2"
httpdate = "1"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
# Names TLS failures in reqwest's errors, so it must stay the rustls version that reqwest uses.
rustls = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "time", "io-util", "io-std", "fs", "sync"] }
tempfile = "3"
thiserror = "2.0.21"
# `std` only: without the `attributes` feature, `#[instrument]` cannot record function arguments.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Only the ev-grep binary installs a subscriber: JSON records, without ANSI colors or the `log` bridge.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json"] }
wiremock = "0.6"
ev-grep-core = { path = "crates/ev-grep-core" }
ev-grep-jev = { path = "crates/ev-grep-jev" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
install-path = "~/.local/bin"
install-updater = false
checksum = "sha256"
pr-run-mode = "upload"
dispatch-releases = true
plan-jobs = ["./check"]
global-artifacts-jobs = ["./release-smoke"]

# Intel runners built releases 1.5 to 3 times slower than Apple Silicon runners, so Apple Silicon cross-compiles the
# Intel binary. Release smoke tests still run it on an Intel runner.
[workspace.metadata.dist.github-custom-runners]
x86_64-apple-darwin = "macos-14"

[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"swatinem/rust-cache" = "49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c"
