---
"jobs":
  "smoke":
    "name": "Smoke ${{ matrix.target }}"
    "runs-on": "${{ matrix.runner }}"
    "steps":
      - "env":
          "EXPECTED_MACHINE": "${{ matrix.machine }}"
        "name": "Verify native architecture"
        "run": |
          machine=$(uname -m)
          test "${machine}" = "${EXPECTED_MACHINE}"
      - "if": "matrix.target == 'x86_64-apple-darwin'"
        "name": "Reject Rosetta translation"
        "run": |
          translated=$(/usr/sbin/sysctl -in sysctl.proc_translated)
          [[ "${translated}" =~ ^0?$ ]]
        "shell": "bash"
      - "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
        "with":
          "persist-credentials": false
      - "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        "with":
          "merge-multiple": true
          "path": "artifacts"
          "pattern": "artifacts-build-local-*"
      - "uses": "jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c" # v4
        "with":
          "cache": false
          "env": false
          "install_args": "python@3.14.7 uv@0.12.9"
          "version": "2026.8.12"
      - "env":
          "PLAN": "${{ inputs.plan }}"
          "TARGET": "${{ matrix.target }}"
        "name": "Run packaged binary"
        "run": "mise run release:verify-package"
      - "env":
          "TARGET": "${{ matrix.target }}"
        "name": "Search through local fake providers"
        "run": "mise run release:smoke \"unpacked/ev-grep-${TARGET}/ev-grep\""
    "strategy":
      "fail-fast": false
      "matrix":
        "include":
          - "machine": "arm64"
            "runner": "namespace-profile-public-macos"
            "target": "aarch64-apple-darwin"
          - "machine": "x86_64"
            "runner": "macos-15-intel"
            "target": "x86_64-apple-darwin"
          - "machine": "aarch64"
            "runner": "namespace-profile-release-linux-arm64"
            "target": "aarch64-unknown-linux-gnu"
          - "machine": "x86_64"
            "runner": "namespace-profile-release-linux"
            "target": "x86_64-unknown-linux-gnu"
    "timeout-minutes": 5
"name": "Release smoke tests"
"on":
  "workflow_call":
    "inputs":
      "plan":
        "required": true
        "type": "string"
"permissions":
  "contents": "read"
...
