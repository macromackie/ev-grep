---
"jobs":
  "smoke":
    "name": "Smoke ${{ matrix.target }}"
    "runs-on": "${{ matrix.runner }}"
    "steps":
      - "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
        "with":
          "persist-credentials": false
      - "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        "with":
          "merge-multiple": true
          "path": "artifacts"
          "pattern": "artifacts-build-local-*"
      - "env":
          "PLAN": "${{ inputs.plan }}"
          "TARGET": "${{ matrix.target }}"
        "name": "Run packaged binary"
        "run": |
          set -euo pipefail
          archive="artifacts/ev-grep-${TARGET}.tar.xz"
          expected=$(awk '{print $1}' "${archive}.sha256")
          actual=$(shasum -a 256 "${archive}" | awk '{print $1}')
          test "${actual}" = "${expected}"
          mkdir unpacked
          tar -xJf "${archive}" -C unpacked
          binary="${PWD}/unpacked/ev-grep-${TARGET}/ev-grep"
          version=$(printf '%s' "${PLAN}" | jq -r '.releases[] | select(.app_name == "ev-grep") | .app_version')
          reported=$("${binary}" --version)
          test "${reported}" = "ev-grep ${version}"
          "${binary}" --help
          printf 'fn main() {}\n' > sample.rs
          "${binary}" 'contains a main function' sample.rs --dry-run --json > output.jsonl
          jq -s -e '[.[] | select(.type == "selected")] | length == 1' output.jsonl
        "shell": "bash"
      - "env":
          "TARGET": "${{ matrix.target }}"
        "name": "Search through local fake providers"
        "run": "mise-tasks/release/smoke \"unpacked/ev-grep-${TARGET}/ev-grep\""
    "strategy":
      "fail-fast": false
      "matrix":
        "include":
          - "runner": "macos-14"
            "target": "aarch64-apple-darwin"
          - "runner": "macos-15-intel"
            "target": "x86_64-apple-darwin"
          - "runner": "ubuntu-24.04-arm"
            "target": "aarch64-unknown-linux-gnu"
          - "runner": "ubuntu-22.04"
            "target": "x86_64-unknown-linux-gnu"
    "timeout-minutes": 5
"name": "Release smoke tests"
"on":
  "workflow_call":
    "inputs":
      "plan":
        "required": true
        "type": "string"
"permissions":
  "contents": "read"
...
