---
"concurrency":
  "cancel-in-progress": false
  "group": "start-release"
"jobs":
  "dispatch":
    "name": "Dispatch"
    "permissions":
      "actions": "write" # Start release.yml for the version tag.
      "contents": "write" # Create the version tag.
    "runs-on": "namespace-profile-public-linux"
    "steps":
      - "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803" # v6
        "with":
          "persist-credentials": false
      - "uses": "jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c" # v4
        "with":
          "cache": false
          "env": false
          "install": false
          "version": "2026.8.12"
      - "env":
          "GH_REPO": "${{ github.repository }}"
          "GH_TOKEN": "${{ github.token }}"
        "name": "Release the version commit"
        "run": "mise run release:start"
    "timeout-minutes": 5
"name": "Start release"
"on":
  "push":
    "branches":
      - "main"
  "workflow_dispatch": {}
"permissions": {}
...
